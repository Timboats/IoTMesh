[env:esp32dev]
platform = espressif32@6.11.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
 	painlessmesh/painlessMesh@^1.5.3
 	smfsw/Queue@^2.0
 	adafruit/Adafruit GFX Library@^1.12.1
 	adafruit/Adafruit ILI9341@^1.6.2