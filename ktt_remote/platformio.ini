[env:esp32dev]
platform = espressif32@6.11.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Code in this block is for OTA Update
upload_protocol = espota
upload_port = 192.168.4.1
lib_deps = 
 	painlessmesh/painlessMesh@^1.5.3
 	smfsw/Queue@^2.0
 	; adafruit/Adafruit GFX Library@^1.12.1
 	; adafruit/Adafruit ILI9341@^1.6.2
	ESP32Async/AsyncTCP
	bodmer/TFT_eSPI @ ^2.5.43

build_flags =
  -Os
  -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
  -DUSER_SETUP_LOADED=1
  
  ; Define the TFT driver, pins etc. here:
  -DILI9341_DRIVER=1
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=240
  -DTFT_MISO=27
  -DTFT_MOSI=26
  -DTFT_SCLK=25
  -DTFT_CS=13
  -DTFT_DC=33
  -DTFT_RST=32
  ;-DTFT_BL=21
  ;-DTOUCH_CS=22
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=40000000
